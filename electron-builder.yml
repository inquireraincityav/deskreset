# electron-builder config.
# Goal: produce a single draggable file suitable for USB or AirDrop.
#   - macOS: .dmg (double-click, drag to Applications) and a zipped .app for pure drag-and-drop.
#   - Windows: a portable .exe (no installer) and an NSIS installer.
appId: com.deskreset.app
productName: Desk Reset
copyright: Copyright © 2026 Desk Reset
directories:
  buildResources: build
  output: release

files:
  - "out/**/*"
  - "package.json"
  - "!**/*.map"

extraResources:
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png

# Ship the quarantine-clearing helper inside the DMG next to the app,
# so a recipient who AirDrops the DMG has the fix at hand.
dmg:
  title: "Desk Reset ${version}"
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications
    - x: 270
      y: 330
      type: file
      path: scripts/clear-quarantine.command

# macOS
mac:
  category: public.app-category.healthcare-fitness
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No Apple Developer account yet, so we ad-hoc sign (codesign --sign -).
  # That satisfies macOS's "arm64 binaries must be signed" rule, so the
  # app will at least launch. Gatekeeper still flags AirDropped copies
  # with the quarantine bit — the recipient clears it once with:
  #   xattr -cr "/Applications/Desk Reset.app"
  # (or runs scripts/clear-quarantine.command). Real notarization is
  # Phase 4 when an Apple Developer account is available.
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: "-"           # ad-hoc identity
  extendInfo:
    LSUIElement: 1 # menu-bar-only app; no Dock icon

# Windows
win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]

portable:
  artifactName: "DeskReset-${version}-portable.exe"

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
