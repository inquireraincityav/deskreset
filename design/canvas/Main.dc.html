<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Break screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',system-ui,sans-serif}
h1,button,.d{font-family:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif}
button{cursor:pointer}
</style>
</helmet>
<div style="position:relative;width:1440px;height:900px;overflow:hidden;color:#261852;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',system-ui,sans-serif;background:#10264f">
<div style="position:absolute;inset:0">
<dc-import name="BlurredDesktop" hint-size="1440px,900px"></dc-import>
</div>
<div style="position:absolute;inset:0;background:rgba(243,238,255,0.72);backdrop-filter:blur({{blur}}px) saturate(1.1);-webkit-backdrop-filter:blur({{blur}}px) saturate(1.1)"></div>

<div style="position:absolute;top:36px;left:0;right:0;display:flex;justify-content:center">
<div class="d" style="display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,0.65);border:1px solid rgba(255,255,255,0.9);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:#261852">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F2FC4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
5:40 PM
</div>
</div>

<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding-bottom:40px">
<div class="d" style="font-size:16px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#4F2FC4">Eye break · 3 of 8 today</div>
<h1 style="margin:0;font-size:92px;line-height:1.03;font-weight:600;letter-spacing:-0.025em;color:#261852">Eyes to the horizon</h1>
<p style="margin:0;font-size:26px;line-height:1.45;color:#43367A;max-width:640px">Look at something far away until the countdown ends. Let your shoulders drop.</p>
<div style="width:120px;height:3px;border-radius:3px;background:rgba(79,47,196,0.3);margin:10px 0 4px"></div>
<div class="d" style="font-size:80px;font-weight:600;font-variant-numeric:tabular-nums;color:{{accent}};letter-spacing:0.01em">00:18</div>
<div style="width:420px;height:8px;border-radius:999px;background:rgba(38,24,82,0.14);overflow:hidden">
<div style="width:10%;height:100%;border-radius:999px;background:#6B46E5"></div>
</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:52px;display:flex;flex-direction:column;align-items:center;gap:16px">
<div style="display:flex;gap:14px">
<button style="position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;background:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.95);color:#261852;font-size:18px;font-weight:600">
<span style="position:absolute;left:0;top:0;bottom:0;width:38%;background:rgba(107,70,229,0.18)"></span>
<svg style="position:relative" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F2FC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l6 6-6 6"/><path d="M13 6l6 6-6 6"/></svg>
<span style="position:relative">Hold to skip</span>
</button>
<button style="display:flex;align-items:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;background:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.95);color:#261852;font-size:18px;font-weight:600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F2FC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
Lock screen
</button>
</div>
<div style="font-size:16px;color:#43367A;text-align:center;line-height:1.6">
2 skips left today · Press <span class="d" style="padding:2px 9px;border-radius:7px;background:rgba(255,255,255,0.75);border:1px solid rgba(79,47,196,0.3);font-weight:600;color:#261852">Esc</span> twice to snooze 5 min
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5B36D6","options":["#5B36D6","#7A4FE8","#3D2AA8"]},"blur":{"editor":"range","min":0,"max":80,"step":2,"default":40,"unit":"px"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#5B36D6', blur: this.props.blur ?? 40 };
}
}
</script>
</body>
</html>
