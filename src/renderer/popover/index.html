<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src data:;">
  <title>Desk Reset</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="card">
    <section>
      <div class="eyebrow d">Next break</div>
      <div class="next">
        <span id="next-countdown" class="d">—</span>
        <span id="next-kind">—</span>
      </div>
      <div id="following" class="sub">—</div>
    </section>

    <div class="stats">
      <div class="stat">
        <div class="stat-num d"><span id="breaks-n">0</span> <span class="stat-den">/ <span id="breaks-goal">0</span></span></div>
        <div class="stat-label">Breaks</div>
      </div>
      <div class="stat">
        <div class="stat-num d accent"><span id="sips-n">0</span> <span class="stat-den">/ <span id="sips-goal">10</span></span></div>
        <div class="stat-label">Sips</div>
      </div>
      <div class="stat">
        <div class="stat-num d"><span id="skips-n">0</span></div>
        <div class="stat-label">Skips</div>
      </div>
    </div>

    <div class="actions">
      <button id="start-now" class="btn btn-primary">Start a break now</button>
      <button id="take-sip" class="btn btn-glass">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F2FC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></svg>
        Take a sip
      </button>
      <div class="row">
        <button id="pause" class="btn btn-ghost">Pause 1 hour</button>
        <button id="settings" class="btn btn-ghost">Settings</button>
      </div>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
