<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src data:;">
  <title>Desk Reset — heads-up</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="card">
    <div class="row">
      <div class="icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </div>
      <div class="text">
        <div id="countdown" class="d">00:10</div>
        <div id="message">Almost time. Your eyes will appreciate this.</div>
      </div>
    </div>
    <div class="buttons">
      <button id="start" class="btn btn-primary">Start now</button>
      <button class="btn btn-glass snooze" data-m="1">+1m</button>
      <button class="btn btn-glass snooze" data-m="5">+5m</button>
      <button class="btn btn-glass snooze" data-m="15">+15m</button>
    </div>
    <div id="footer">— snoozes left today</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
